web:
  port: 8080

storage:
  type: postgres
  path: "postgres://gatusadmin:$DB_PASSWORD@$DB_HOST:5432/gatusdb?sslmode=require"
endpoints:

  - name: App Health
    group: application
    url: "https://tm.hayat-labs.co.uk"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"

  - name: TLS Certificate
    group: security
    url: "https://tm.hayat-labs.co.uk"
    interval: 300s
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: HTTP to HTTPS Redirect
    group: application
    url: "http://tm.hayat-labs.co.uk"
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 301"

  - name: Companies House API
    group: external
    url: "https://api.company-information.service.gov.uk"
    interval: 60s
    conditions:
      - "[STATUS] == 401"

  - name: Companies House Search
    group: external
    url: "https://api.company-information.service.gov.uk/search/companies?q=test"
    interval: 60s
    conditions:
      - "[STATUS] == 401"

  - name: Companies House Website
    group: external
    url: "https://find-and-update.company-information.service.gov.uk"
    interval: 60s
    conditions:
      - "[STATUS] == 200"